name: Android build and secure release

on:
  push:
    branches: [main, "hortensiadelio-glitch-patch-1"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanaoka-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=fanaoka-alpha-$VERSION_NAME-debug" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and generate SHA-256
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check signing secrets and restore keystore
        env:
          FANAOKA_KEYSTORE_BASE64: ${{ secrets.FANAOKA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FANAOKA_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret FANAOKA_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fanaoka-signing"
          printf '%s' "$FANAOKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fanaoka-signing/upload.jks"
          test -s "$RUNNER_TEMP/fanaoka-signing/upload.jks"
          echo "FANAOKA_KEYSTORE_PATH=$RUNNER_TEMP/fanaoka-signing/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          FANAOKA_KEYSTORE_PASSWORD: ${{ secrets.FANAOKA_KEYSTORE_PASSWORD }}
          FANAOKA_KEY_ALIAS: ${{ secrets.FANAOKA_KEY_ALIAS }}
          FANAOKA_KEY_PASSWORD: ${{ secrets.FANAOKA_KEY_PASSWORD }}
        run: |
          test -n "$FANAOKA_KEYSTORE_PASSWORD"
          test -n "$FANAOKA_KEY_ALIAS"
          test -n "$FANAOKA_KEY_PASSWORD"
          gradle --no-daemon assembleRelease

      - name: Verify signature and generate SHA-256
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FANAOKA ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
